[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/debugger/protocol",
    "crates/debugger/plugin",
    "crates/debugger/adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
# Não sai no crates.io: é distribuído como binário, no release e no VSIX.
publish = false
repository = "https://github.com/NullSablex/PawnPro-Core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
interprocess = "2"
tokio = "1.53"
tokio-util = "0.7"
similar = { version = "3.2", default-features = false, features = ["std"] }
rust-samp-sdk = { version = "3.4.0", default-features = false, features = ["debug"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
