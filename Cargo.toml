[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/NullSablex/PawnPro-Core"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
interprocess = "2"
tokio = "1.53"

[profile.release]
lto = true
codegen-units = 1
strip = true
