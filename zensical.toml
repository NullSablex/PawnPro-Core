[project]
site_name = "PawnPro Core"
site_url = "https://pawnpro-core.nullsablex.com/"
site_description = "Núcleo em Rust do PawnPro — supervisiona a engine (LSP) e o depurador (DAP)"
site_author = "NullSablex"
repo_name = "NullSablex/PawnPro-Core"
repo_url = "https://github.com/NullSablex/PawnPro-Core"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Início" = "index.md" },
  { "Interno" = [
    { "Arquitetura" = "architecture.md" },
    { "O contrato com a extensão" = "rpc.md" },
    { "Configuração e projeto" = "configuration.md" },
    { "O servidor do jogo" = "server.md" },
    { "A engine" = "engine.md" },
    { "Depuração" = "debugger.md" },
    { "Supervisão" = "supervision.md" },
    { "Dependências e build" = "dependencies.md" },
  ] },
]

[project.theme]
language = "pt-BR"
logo = "icon.svg"
favicon = "icon.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.tracking",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Tema escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Tema claro"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
permalink_title = "Link permanente"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
