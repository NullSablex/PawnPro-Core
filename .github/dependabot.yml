version: 2

# Uma entrada por área, para que cada PR de atualização só mexa (e só dispare
# os checks de CI) da própria área: o workspace Rust, os workflows e o gerador
# da documentação.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    # Dependências transitivas também: quase tudo o que o lockfile fixa chega
    # por outros crates, e uma versão corrigida de um deles só apareceria quando
    # o `cargo audit` reprovasse um PR que não tem nada a ver.
    allow:
      - dependency-type: all
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: docs(deps)
