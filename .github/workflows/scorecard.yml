# OpenSSF Scorecard.
#
# Scores the repository's supply-chain practices (branch protection, pinned
# actions, token permissions, dependency update tooling, …) and uploads the
# result twice: as SARIF to code scanning, and — via `publish_results` — to the
# public OpenSSF API, which is what backs the Scorecard badge in the README.
#
# `publish_results` only works for runs on the default branch of a public
# repository, which is what the weekly and manual runs below are. It does not
# run on every push: the score changes with repository settings, not commits.
name: Scorecard

on:
  # Weekly, so the score keeps up with the checks Scorecard adds over time.
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  # Scorecard only analyzes public repositories: on a private one the GraphQL
  # queries are refused ("Resource not accessible by integration") and the run
  # fails. The event payload can't be trusted for this — the weekly `schedule`
  # carries no repository object — so the visibility is asked at run time.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" -q '.private | not')" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results
      id-token: write          # OIDC token, required to publish the results
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept for 5 days so a failed upload can still be inspected.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
