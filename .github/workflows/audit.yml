name: Dependency audit

# Reusable: called by ci.yml when Cargo.lock changes. Also weekly: an advisory
# published against a crate already in Cargo.lock arrives on RustSec's clock,
# not on a pull request's.
on:
  workflow_call:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Falha se houver vulnerabilidade conhecida nas dependências (RustSec).
      - name: Audit dependencies
        run: cargo audit
